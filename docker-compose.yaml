services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile-backend
    container_name: ares-backend
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile-frontend
    container_name: ares-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
